<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cryon · Crypto Portfolio</title>
  <!-- Font Awesome 6.7.2 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!-- CanvasJS -->
  <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
  <!-- Main Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Top Navigation -->
    <header class="header">
      <div class="header-left">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>
        <div class="logo">
          <i class="fas fa-gem"></i>
          <span>Cryon</span>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" aria-label="Notifications">
          <i class="fas fa-bell"></i>
          <span class="badge">3</span>
        </button>
        <button class="icon-btn" aria-label="Profile">
          <i class="fas fa-user-circle"></i>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Balance Section -->
      <section class="balance-section">
        <div class="balance-header">
          <span class="balance-label">Total Balance</span>
          <span class="balance-change" id="changeBadge">
            <i class="fas fa-arrow-up"></i> +8.42%
          </span>
        </div>
        <div class="balance-amount" id="totalBalance">$12,418,520.90</div>
        <div class="balance-sub">
          <span>≈ 184.52 BTC</span>
          <span class="divider">|</span>
          <span>2,847.62 ETH</span>
        </div>
      </section>

      <!-- Quick Stats -->
      <div class="quick-stats" id="wealthStats">
        <div class="stat-card">
          <div class="stat-label">Net Worth</div>
          <div class="stat-value" id="netWorthDisplay">$12.4M</div>
          <div class="stat-change positive">+18.3%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Assets</div>
          <div class="stat-value" id="totalAssetsDisplay">$8.2M</div>
          <div class="stat-change positive">+12.7%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Holdings</div>
          <div class="stat-value" id="diversificationDisplay">14</div>
          <div class="stat-change">Assets</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Best Performer</div>
          <div class="stat-value highlight" id="bestPerformerDisplay">SOL</div>
          <div class="stat-change positive" id="bestPerformerChange">+42.3%</div>
        </div>
      </div>

      <!-- Chart Section -->
      <div class="chart-section">
        <div class="chart-header">
          <div class="chart-timeframes" id="timeFilterContainer">
            <button class="time-btn" data-time="1H">1H</button>
            <button class="time-btn active" data-time="24H">24H</button>
            <button class="time-btn" data-time="7D">7D</button>
            <button class="time-btn" data-time="30D">30D</button>
            <button class="time-btn" data-time="3M">3M</button>
            <button class="time-btn" data-time="1Y">1Y</button>
            <button class="time-btn" data-time="ALL">ALL</button>
          </div>
        </div>
        <div id="chartContainer"></div>
      </div>

      <!-- Portfolio Section -->
      <div class="portfolio-section">
        <div class="section-header">
          <h2>Portfolio</h2>
          <button class="view-all">View All <i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="portfolio-list" id="portfolioList"></div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </button>
      <button class="nav-item">
        <i class="fas fa-coins"></i>
        <span>Portfolio</span>
      </button>
      <button class="nav-item">
        <i class="fas fa-chart-line"></i>
        <span>Markets</span>
      </button>
      <button class="nav-item">
        <i class="fas fa-clock"></i>
        <span>Activity</span>
      </button>
      <button class="nav-item">
        <i class="fas fa-user"></i>
        <span>Account</span>
      </button>
    </nav>
  </div>

  <!-- Developer Overlay -->
  <div class="dev-overlay" id="devOverlay">
    <div class="dev-panel">
      <div class="dev-header">
        <h3><i class="fas fa-code"></i> Developer Console</h3>
        <button class="dev-close" id="closeDevBtn"><i class="fas fa-times"></i></button>
      </div>
      <div id="devControls"></div>
    </div>
  </div>

  <!-- Main JavaScript -->
  <script src="app.js"></script>
</body>
</html>
